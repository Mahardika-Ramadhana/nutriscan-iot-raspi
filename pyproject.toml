[project]
name = "nutriscan-iot-raspi"
version = "1.0.0"
description = "NutriScan Edge AI & Load Cell IoT apparatus for MBG meal segmentation and nutrition estimation on Raspberry Pi 4."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.4",
    "ncnn",
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "flask>=3.0",
    "paho-mqtt>=2.0",
    "supabase>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
addopts = "-v --cov=src/nutriscan --cov-report=term-missing"
