<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriScan MBG - Edge AI Dashboard</title>
    <style>
        :root {
            --bg: #0b1120;
            --card: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.14);
            --accent: #38bdf8;
            --ok: #10b981;
            --warn: #f59e0b;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top right, #1e293b, var(--bg));
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .layout {
            max-width: 980px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
        }
        .card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }
        h1, h2 { margin: 0 0 12px 0; }
        h1 { font-size: 1.4rem; }
        h2 { font-size: 1.05rem; color: var(--muted); }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            background: rgba(56, 189, 248, 0.18);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.45);
        }
        .badge.ok { background: rgba(16, 185, 129, 0.18); color: var(--ok); border-color: rgba(16, 185, 129, 0.45); }
        .badge.warn { background: rgba(245, 158, 11, 0.18); color: var(--warn); border-color: rgba(245, 158, 11, 0.45); }
        .weight-big { font-size: 2.4rem; font-weight: 800; margin: 10px 0; }
        .preview {
            width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #020617;
            min-height: 200px;
            object-fit: contain;
        }
        .macros {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 12px 0;
        }
        .macro-box {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
        }
        .macro-label { font-size: 0.8rem; color: var(--muted); }
        .macro-val { font-size: 1.35rem; font-weight: 700; margin-top: 4px; }
        ul.items { list-style: none; padding: 0; margin: 0; }
        ul.items li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.92rem;
        }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
        button, a.btn {
            background: rgba(56, 189, 248, 0.2);
            color: var(--text);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 10px;
            padding: 8px 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
        }
        input.token {
            width: 100%;
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(2, 6, 23, 0.7);
            color: var(--text);
        }
        .muted { color: var(--muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="layout">
        <div class="card">
            <div class="row">
                <div>
                    <h1>NutriScan MBG</h1>
                    <div class="muted">{{ device_id }} • {{ location }}</div>
                </div>
                <span id="stateBadge" class="badge">IDLE</span>
            </div>
            <div class="weight-big"><span id="weightVal">0.0</span> g</div>
            <div class="muted" id="queueText">Antrean Sync: -</div>
            <img id="previewImg" class="preview" alt="Hasil Segmentasi Nampan" />
            <input id="apiTokenInput" class="token" type="password" placeholder="API Token (opsional, untuk Tare / Trigger / Sync)" />
            <div class="controls">
                <button id="btnTrigger" type="button">Scan Manual</button>
                <button id="btnTare" type="button">Tare (Nol-kan)</button>
                <button id="btnSync" type="button">Sync Cloud</button>
                <a class="btn" href="/api/export_csv">Export CSV</a>
            </div>
            <div class="muted" id="actionMsg" style="margin-top:8px;"></div>
        </div>

        <div class="card">
            <h2>Estimasi Gizi Nampan Terakhir</h2>
            <div class="macros">
                <div class="macro-box"><div class="macro-label">Energi</div><div class="macro-val" id="mEnergi">- kkal</div></div>
                <div class="macro-box"><div class="macro-label">Protein</div><div class="macro-val" id="mProtein">- g</div></div>
                <div class="macro-box"><div class="macro-label">Lemak</div><div class="macro-val" id="mLemak">- g</div></div>
                <div class="macro-box"><div class="macro-label">Karbohidrat</div><div class="macro-val" id="mKarbo">- g</div></div>
            </div>
            <h2>Komponen Menu Terdeteksi</h2>
            <ul class="items" id="compList"></ul>
        </div>
    </div>

    <script>
        const tokenInput = document.getElementById("apiTokenInput");
        tokenInput.value = sessionStorage.getItem("nutriscan_api_token") || "";
        tokenInput.addEventListener("input", () => {
            sessionStorage.setItem("nutriscan_api_token", tokenInput.value);
        });

        async function postAction(endpoint) {
            const msgEl = document.getElementById("actionMsg");
            try {
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + tokenInput.value.trim() }
                });
                const body = await res.json();
                msgEl.textContent = body.message || body.status || ("HTTP " + res.status);
            } catch (err) {
                msgEl.textContent = "Error: " + err;
            }
        }

        document.getElementById("btnTrigger").addEventListener("click", () => postAction("/api/trigger"));
        document.getElementById("btnTare").addEventListener("click", () => postAction("/api/tare"));
        document.getElementById("btnSync").addEventListener("click", () => postAction("/api/sync_cloud"));

        let lastScanId = null;

        async function pollStatus() {
            try {
                const res = await fetch("/api/status");
                const data = await res.json();

                const badge = document.getElementById("stateBadge");
                badge.textContent = data.state;
                badge.className = "badge " + (data.state === "PROCESSING" || data.state === "STABILIZING" ? "warn" : "ok");

                document.getElementById("weightVal").textContent = Number(data.current_weight_g || 0).toFixed(1);
                const q = data.queue_stats || {};
                document.getElementById("queueText").textContent =
                    `Total: ${q.total || 0} | Pending: ${q.pending || 0} | Synced: ${q.synced || 0}`;

                const scan = data.last_scan;
                if (scan) {
                    const gizi = scan.total_gizi || {};
                    document.getElementById("mEnergi").textContent = gizi.energi_kcal != null ? `${gizi.energi_kcal} kkal` : "- kkal";
                    document.getElementById("mProtein").textContent = gizi.protein_g != null ? `${gizi.protein_g} g` : "- g";
                    document.getElementById("mLemak").textContent = gizi.lemak_g != null ? `${gizi.lemak_g} g` : "- g";
                    document.getElementById("mKarbo").textContent = gizi.karbohidrat_g != null ? `${gizi.karbohidrat_g} g` : "- g";

                    const ul = document.getElementById("compList");
                    ul.replaceChildren();
                    const comps = scan.komponen || {};
                    for (const [name, info] of Object.entries(comps)) {
                        const li = document.createElement("li");
                        const left = document.createElement("span");
                        left.textContent = name;
                        const right = document.createElement("span");
                        const pct = ((info.proporsi || 0) * 100).toFixed(1);
                        const grams = info.estimasi_gram != null ? `${info.estimasi_gram} g` : "-";
                        const kcal = info.gizi && info.gizi.energi_kcal != null ? ` • ${info.gizi.energi_kcal} kkal` : "";
                        right.textContent = `${pct}% (~${grams}${kcal})`;
                        li.append(left, right);
                        ul.appendChild(li);
                    }

                    if (scan.scan_id !== lastScanId) {
                        lastScanId = scan.scan_id;
                        document.getElementById("previewImg").src = "/api/image?t=" + Date.now();
                    }
                }
            } catch (_e) {
                // Abaikan error polling sementara
            }
        }

        pollStatus();
        setInterval(pollStatus, 800);
    </script>
</body>
</html>
